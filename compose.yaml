services:
  php:
    # No `target:` here on purpose: the default is the last stage
    # (frankenphp_prod). compose.override.yaml switches it to frankenphp_dev.
    build:
      context: ./api
    image: ${IMAGES_PREFIX:-}movieshelf-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      # Committed api/.env leaves this empty, so without injecting it here the
      # container signs sessions and CSRF tokens with a blank secret.
      APP_SECRET: ${APP_SECRET:-}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Connects as the restricted "symfony" RW role (owns raw + canonical, reads mart) — NOT the superuser.
      DATABASE_URL: postgresql://symfony:${SYMFONY_DB_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Ingestion keys come from the root .env, never from api/.env.local:
      # api/.dockerignore excludes that file, so it does not exist in a built image.
      NYT_KEY: ${NYT_KEY:-}
      TMDB_KEY: ${TMDB_KEY:-}
      ###> dunglas/symfony-docker ###
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
      ###< dunglas/symfony-docker ###
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    depends_on:
      db: { condition: service_healthy }

  analytics:
    build:
      context: ./analytics
    image: ${IMAGES_PREFIX:-}movieshelf-analytics
    restart: unless-stopped
    environment:
      # Connects as the restricted "analytics" role: RO on raw + canonical,
      # RW on mart. Never the superuser, and never the symfony role.
      DATABASE_URL: postgresql://analytics:${ANALYTICS_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    # POSTGRES_* configure the superuser + default database (created by the image).
    # SYMFONY_/ANALYTICS_DB_PASSWORD are NOT understood by the image — they are here
    # purely so our init script (db/init/01-roles.sh) can read them from its env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYMFONY_DB_PASSWORD: ${SYMFONY_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
