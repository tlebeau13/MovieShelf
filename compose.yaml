services:
  php:
    # Build context is api/ only — the Dockerfile and frankenphp/ live there.
    # No `target:` here on purpose: the default is the last stage (frankenphp_prod).
    # compose.override.yaml switches it to frankenphp_dev for local work.
    build:
      context: ./api
    image: ${IMAGES_PREFIX:-}movieshelf-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      # Connects as the restricted "symfony" RW role (owns raw + canonical, reads mart) — NOT the superuser.
      DATABASE_URL: postgresql://symfony:${SYMFONY_DB_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      ###> dunglas/symfony-docker ###
      # Next lines are only used during initial installation
      # This block will remove itself after the installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
      ###< dunglas/symfony-docker ###
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    # POSTGRES_* configure the superuser + default database (created by the image).
    # SYMFONY_/ANALYTICS_DB_PASSWORD are NOT understood by the image — they are here
    # purely so our init script (db/init/01-roles.sh) can read them from its env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYMFONY_DB_PASSWORD: ${SYMFONY_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      # Exposed for local tooling (psql, DBeaver). Inside the compose network,
      # other services reach this as host "db", port 5432.
      - "5432:5432"
    volumes:
      # Named volume = data survives `docker compose down`. The init scripts below
      # run ONLY when this volume is empty (first boot). See db/README.md.
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, alphabetically, on first init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Lets future services wait with: depends_on: { db: { condition: service_healthy } }
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

volumes:
  pgdata:
  caddy_data:
  caddy_config:

