name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The only executable code so far is the DB contract (schemas, roles, grants).
  # As the other components land, add sibling jobs:
  #   api-tests      -> PHP setup + composer install + phpunit   (issue #2)
  #   analytics-tests-> Python setup + pip install + pytest       (issue #3)
  #   web-tests      -> Node setup + npm ci + lint + build        (issue #4)
  db-contract:
    name: DB contract (schemas · roles · write-boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint init shell scripts
        run: shellcheck db/init/*.sh

      - name: Provide env for compose
        # .env is gitignored; CI uses the committed example (throwaway passwords).
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Boot the database
        # --wait blocks until the healthcheck passes (or fails the step).
        run: docker compose up -d --wait db

      - name: Verify the RAW / canonical / MART contract
        run: |
          set -euo pipefail
          q() { docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$1" -d cineshelf -tAc "$2"; }

          echo "→ schemas exist with correct owners"
          q cineshelf "SELECT nspname||' -> '||pg_get_userbyid(nspowner)
                       FROM pg_namespace WHERE nspname IN ('raw','canonical','mart') ORDER BY 1"

          echo "→ owners can write their own layer"
          q symfony   "CREATE TABLE raw.ci_probe(id int)"
          q analytics "CREATE TABLE mart.ci_probe(id int)"

          echo "→ write-boundary is enforced (these MUST be denied)"
          if q symfony   "CREATE TABLE mart.bad(id int)" 2>/dev/null; then
            echo "::error::symfony was able to write into mart"; exit 1; fi
          if q analytics "CREATE TABLE raw.bad(id int)" 2>/dev/null; then
            echo "::error::analytics was able to write into raw"; exit 1; fi

          echo "→ cross-layer reads work (default privileges)"
          q analytics "SELECT count(*) FROM raw.ci_probe"
          q symfony   "SELECT count(*) FROM mart.ci_probe"

          echo "✅ contract holds"

      - name: Dump db logs on failure
        if: failure()
        run: docker compose logs db

      - name: Teardown
        if: always()
        run: docker compose down -v
