name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The RAW/canonical/MART write boundary, verified from three angles: each
  # service's own suite proves the connection *it* opens is constrained, and
  # db/verify-contract.sh drives both roles to prove neither can write into the
  # other's layer. See issue #19 and ARCHITECTURE.md.
  #
  # As the last component lands, add a sibling job:
  #   web-tests -> Node setup + yarn install + lint + build   (issue #4)
  write-boundary:
    name: Write boundary (db grants · api · analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck db/init/*.sh db/*.sh

      - name: Provide env for compose
        # .env is gitignored; CI uses the committed example (throwaway passwords).
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Hand the workspace to the container user
        # compose.override.yaml bind-mounts api/ and analytics/ and runs both
        # containers as uid 1000, but the runner checks out as 1001. Without
        # this the entrypoint's `composer install` cannot write vendor/.
        run: sudo chown -R 1000:1000 api analytics

      - name: Boot the stack
        # Dev targets, not prod: the prod images install --no-dev, so they carry
        # neither phpunit nor pytest. The php entrypoint installs dependencies
        # and runs Doctrine migrations before reporting healthy, which is what
        # creates the RAW table the analytics suite reads.
        run: docker compose up -d --wait --wait-timeout 600 db php analytics

      - name: api/ — symfony cannot write MART
        run: docker compose exec -T php bin/phpunit

      - name: analytics/ — analytics cannot write RAW or canonical
        run: docker compose exec -T analytics python -m pytest

      - name: db/ — neither role can write the other's layer
        run: ./db/verify-contract.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
