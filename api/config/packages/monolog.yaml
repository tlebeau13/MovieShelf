monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Everything runs in containers, so "the logs" are `make up` / `make
            # worker-logs`. `stderr` is what FrankenPHP and the worker forward to
            # Docker: INFO keeps the lines worth watching (matched route, message
            # received/handled) and drops the per-listener trace that made a single
            # request print ~18 lines. `doctrine` is excluded because every query
            # would land here too.
            stderr:
                type: stream
                path: php://stderr
                level: info
                channels: ["!event", "!doctrine"]
            # The full DEBUG trail, on disk instead of on screen: api/ is
            # bind-mounted, so this is `tail -f api/var/log/dev.log` on the host when
            # a request needs taking apart.
            file:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Nothing is written until a request or a message fails, and then the
            # whole DEBUG trail that led there is flushed at once — the context is
            # there for the failure without paying for it on every happy path.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # JSON to stderr: Docker collects it, and a log shipper can parse it.
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
