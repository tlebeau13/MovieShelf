services:
  db:
    image: postgres:16-alpine
    # POSTGRES_* configure the superuser + default database (created by the image).
    # SYMFONY_/ANALYTICS_DB_PASSWORD are NOT understood by the image — they are here
    # purely so our init script (db/init/01-roles.sh) can read them from its env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYMFONY_DB_PASSWORD: ${SYMFONY_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      # Exposed for local tooling (psql, DBeaver). Inside the compose network,
      # other services reach this as host "db", port 5432.
      - "5432:5432"
    volumes:
      # Named volume = data survives `docker compose down`. The init scripts below
      # run ONLY when this volume is empty (first boot). See db/README.md.
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, alphabetically, on first init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Lets future services wait with: depends_on: { db: { condition: service_healthy } }
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
